services:
  # 🧩 フロントエンド（Next.js）
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: myfitlog-frontend
    env_file:
      - docker/env/frontend.env
    working_dir: /app
    volumes:
      - ./frontend:/app
      - node_modules:/app/node_modules
    command: sh -c "npm install && npm run dev"
    ports:
      - "3000:3000"
    depends_on:
      - backend
    # ローカル開発中のホットリロードを安定させるため
    environment:
      - WATCHPACK_POLLING=true
      - BACKEND_INTERNAL_URL=http://backend:8080

  # ⚙️ バックエンド（Go）
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: myfitlog-backend
    ports:
      - "8080:8080"
    env_file:
      - ./docker/env/backend.env
    working_dir: /app
    volumes:
      - ./backend:/app
    command: air
    depends_on:
      db:
        condition: service_healthy

  # 🗄️ データベース（PostgreSQL）
  db:
    image: postgres:16
    container_name: myfitlog-db
    env_file:
      - ./docker/env/db.env
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  node_modules:
  db_data:
